name: Bug report
description: Something in churnbench does not work as documented.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Command you ran, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal config and commands. Remove secrets and private code.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: churnbench version
      description: Output of `churnbench --version`.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS and Python version
    validations:
      required: true
